{{/* Site-wide CSS and font links. Injected by baseof after theme style.html. Overrides: fonts, colors, forced light mode, footer, details/summary, arrow lists. */}}
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --background-color: #fafafa;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #0000ff;
    --visited-color: #0000ff;
    --blockquote-color: #222;
    --font-main: InterDisplay, Inter, sans-serif;
    --font-secondary: Inter, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
    font-feature-settings: 'liga' 1, 'calt' 1;
  }
  @supports (font-variation-settings: normal) {
    :root {
      --font-main: InterDisplayVariable, InterDisplay, InterVariable, Inter, sans-serif;
      --font-secondary: InterVariable, Inter, sans-serif;
    }
  }
  time {
    font-family: var(--font-mono);
  }
  .title h2 {
    font-family: var(--font-main);
    font-weight: 900;
  }
  .tagline a {
    color: var(--heading-color);
    text-decoration: underline solid;
    text-decoration-color: var(--link-color);
    text-underline-offset: 3px;
  }
  .tagline a:hover {
    text-decoration: none;
  }
  footer {
    padding: 20px 0;
    text-align: left;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 0.2em;
  }
  .footer-brand {
    font-family: var(--font-main);
    font-weight: 900;
    line-height: 0.9;
  }
  .to-top {
    font-family: var(--font-secondary);
    color: var(--heading-color);
    text-decoration: none;
    line-height: 1;
    font-size: 1.5em;
  }
  .to-top:hover {
    text-decoration: none;
  }
  body:not(.is-scrollable) .to-top {
    display: none;
  }
  details {
    border-bottom: 1px dashed var(--text-color);
    padding: 0.6em 0;
  }
  details summary {
    cursor: pointer;
    list-style: none;
    font-family: var(--font-main);
    font-weight: 700;
    color: var(--heading-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  details summary::-webkit-details-marker {
    display: none;
  }
  details summary::after {
    content: "+";
    font-weight: 400;
    font-size: 1.2em;
    line-height: 1;
  }
  details[open] summary::after {
    content: "−";
  }
  details:hover summary {
    color: var(--link-color);
  }
  details ul {
    margin: 0.4em 0 0 0;
    padding-left: 0;
    list-style: none;
  }
  details li {
    font-family: var(--font-mono);
  }
  content ul:not(.blog-posts):not(.pillar-list) {
    list-style: none;
    padding-left: 0;
  }
  content ul:not(.blog-posts):not(.pillar-list) li {
    padding-left: 1.4em;
    position: relative;
  }
  content ul:not(.blog-posts):not(.pillar-list) li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--text-color);
    font-family: var(--font-secondary);
  }

  .pillar-list {
    list-style: none;
    padding: 0;
    margin: 1em 0 0 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 0.3em;
  }
  .pillar-list li {
    display: contents;
  }
  .pillar-name {
    font-weight: bold;
  }
  .franchise-card h3 {
    margin-bottom: 0.2em;
  }
  .franchise-card h3 a {
    color: inherit;
    text-decoration: none;
  }
  .franchise-card p:first-of-type {
    margin-top: 0;
  }
</style>
